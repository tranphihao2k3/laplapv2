# fly.toml app configuration file generated for laplapv2 on 2026-08-17T11:47:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "laplapv2"
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "node -e \"console.log('Release OK')\""

[env]
  PORT = "3000"
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_APP_URL = "https://laplapcantho.store"
  NEXT_PUBLIC_APP_NAME = "LapLap"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  checks = [{ grace_period = '20s', interval = '30s', method = 'GET', path = '/api/health', protocol = 'http', timeout = '5s' }]
  concurrency = { hard_limit = 200, soft_limit = 180, type = 'connections' }

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 180

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"
    protocol = "http"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  cpu_kind = 'shared'
  memory_mb = 512
