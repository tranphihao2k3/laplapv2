# fly.toml app configuration file generated for laplapv2 on 2026-08-17T12:46:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'laplapv2'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = "node -e \"console.log('Release OK')\""

# Env vars NON-SECRET — chỉ những giá trị public/an toàn để lộ.
# Tất cả secret (Supabase keys, API keys, Resend, CRON, MINI_TOOL_SHARED_SECRET...)
# phải đặt bằng `flyctl secrets set` (lưu encrypted trong Fly, không commit git).
[env]
  PORT = "3000"
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_APP_URL = "https://laplapcantho.store"
  NEXT_PUBLIC_APP_NAME = "LapLap"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 180

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512