<!DOCTYPE html>
<!--
  Facebook composer fixture — PW-003 acceptance:
    + Owner-owned HTML mô phỏng composer bình thường.
    + KHÔNG dùng Facebook thật.
-->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Group — composer thường</title>
  </head>
  <body>
    <main>
      <h1>Mua bán đồ cũ</h1>
      <button type="button" aria-label="Tạo bài đăng">Viết bài</button>
      <div
        role="textbox"
        aria-label="Tạo bài đăng"
        contenteditable="true"
        data-testid="composer"
      ></div>
      <button type="button" aria-label="Ảnh/Video">Ảnh/Video</button>
      <button type="button" data-testid="submit-post">Đăng</button>
    </main>
  </body>
</html>
